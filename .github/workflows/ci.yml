name: CleanAI CI/CD Core Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      # `next build` type-checks the whole app — UI, the Express API under
      # server/, and the bridge in app/api — in a single pass.
      - name: Build (Next.js app + API)
        run: npm run build
        env:
          # Build-time only: the schema requires these to parse, but no
          # database connection is opened during a build.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cleanai
          JWT_SECRET: ci_placeholder_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: ci_placeholder_refresh_secret_32_characters_long
          NEXT_TELEMETRY_DISABLED: 1
